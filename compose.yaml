services:
  # Vite dev server with hot module reloading.
  #   docker compose up
  lume-visual-dashboard:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Keep the container's Linux node_modules separate from the host's
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    # Re-sync dependencies on start so lockfile changes are picked up without a rebuild
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    # The browser (not this container) calls the API, at http://localhost:8000 by default.
    depends_on:
      - lume-model-api

  # lume-model-api hosting the in-repo `demo` model with synthetic live inputs.
  # Lightweight (no Bmad/torch), runs natively on arm64, and reloads on source edits.
  #   http://localhost:8000/docs
  lume-model-api:
    build:
      context: ./external/lume-model-api
      dockerfile_inline: |
        FROM python:3.12-slim
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PIP_NO_CACHE_DIR=1
        WORKDIR /app
        # Install dependencies before copying the code so this layer is cached.
        COPY pyproject.toml README.md ./
        RUN python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']))" > /tmp/requirements.txt \
            && pip install -r /tmp/requirements.txt && rm /tmp/requirements.txt
        COPY lume_model_api/ ./lume_model_api/
        RUN pip install --no-deps -e .
        EXPOSE 8000
    ports:
      - "8000:8000"
    environment:
      LUME_MODELS: demo
      LUME_LIVE_SOURCE: synthetic
      LUME_POOL_WORKERS: 2
    volumes:
      - ./external/lume-model-api/lume_model_api:/app/lume_model_api
    command: >
      uvicorn lume_model_api.api.main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/lume_model_api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      start_period: 30s

  # lume-model-api with the real cu_hxr_staged model, built from the upstream Dockerfile
  # (conda, Bmad, torch, lattices). The image is amd64-only, so on Apple Silicon it builds and
  # runs under emulation and is slow. Live inputs are synthetic since EPICS is unreachable.
  #   docker compose --profile full up --build
  #   http://localhost:8001/docs  (set VITE_LUME_API_BASE_URL=http://localhost:8001 to use it)
  lume-model-api-full:
    profiles: [full]
    build:
      context: ./external/lume-model-api
    platform: linux/amd64
    ports:
      - "8001:8000"
    environment:
      LUME_MODELS: cu_hxr_staged
      LUME_LIVE_SOURCE: synthetic
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 180s

  # Production build served by nginx, for testing the real image locally.
  #   docker compose --profile prod up --build
  # Built with BASE_PATH=/ since there is no ingress locally to strip the prefix.
  prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        BASE_PATH: /
    ports:
      - "8080:8080"

volumes:
  node_modules:
  pnpm_store:
