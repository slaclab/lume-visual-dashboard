services:
  # Vite dev server with hot module reloading.
  #   docker compose up
  lume-visual-dashboard:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Keep the container's Linux node_modules separate from the host's
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    # Re-sync dependencies on start so lockfile changes are picked up without a rebuild
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"

  # Production build served by nginx, for testing the real image locally.
  #   docker compose --profile prod up --build
  # Built with BASE_PATH=/ since there is no ingress locally to strip the prefix.
  prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        BASE_PATH: /
    ports:
      - "8080:8080"

volumes:
  node_modules:
  pnpm_store:
