[project]
site_name = "Lume Visual Dashboard"
site_url = "https://slaclab.github.io/lume-visual-dashboard/"
site_author = "SLAC National Accelerator Laboratory - EED / Software Applications Group"
site_description = "Developer and deployment documentation for the LUME Visual Dashboard."

repo_name = "slaclab/lume-visual-dashboard"
repo_url = "https://github.com/slaclab/lume-visual-dashboard"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Development" = [
    { "Routing" = "development/routing.md" },
    { "lume-model-api" = "development/lume-model-api.md" },
    { "Canopy" = "development/canopy.md" },
    { "Choosing a stream" = "development/streams.md" },
    { "Local services" = "development/local-services.md" },
    { "Documentation" = "development/documentation.md" },
  ] },
  { "Deployment" = [
    { "Kubernetes" = "deployment/kubernetes.md" },
    { "Canopy in the cluster" = "deployment/canopy.md" },
    { "Secrets" = "deployment/secrets.md" },
    { "CI and image builds" = "deployment/ci.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.top",
  "navigation.indexes",
  "navigation.footer",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight = {}
pymdownx.superfences = {}
