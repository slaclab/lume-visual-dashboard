name: Update Docker Image

on:
  push:
    branches:
      - main
      - staging
    # These paths are excluded by .dockerignore, so they never change the image.
    paths-ignore:
      - "deploy/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to push (optional, defaults to 'latest' unless on main/staging where it is the short SHA)"
        required: false
        default: ""

# Serialize runs so concurrent pushes to main don't race when committing the tag bump.
concurrency:
  group: update-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: write # commit the new image tag to the prod/staging overlay
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: lume-visual-dashboard
      REGISTRY: ghcr.io

      REPO: ${{ github.repository_owner }}/${IMAGE_NAME}
    steps:
      - name: Set lower case repo owner and image name
        run: |
          echo OWNER_LC=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]') >>${GITHUB_ENV}
          echo REPO_LC=$(echo ${REPO} | tr '[:upper:]' '[:lower:]') >>${GITHUB_ENV}
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
      - name: Set IMAGE_TAG
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/staging" ]]; then
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            echo "IMAGE_TAG=$SHORT_SHA" >> $GITHUB_ENV
          else
            if [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
              echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
            else
              echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            fi
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Canopy isn't built here: slaclab/canopy's Build Image workflow publishes
      # ghcr.io/slaclab/canopy:<short-sha> for each of its main commits. Deploy the one the
      # external/canopy submodule points at, read from the gitlink (no submodule checkout needed).
      # Checked before anything is pushed, so a submodule bump to an unpublished commit fails
      # here instead of deploying a tag that can't be pulled.
      - name: Set CANOPY_TAG
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
        run: |
          CANOPY_TAG=$(git rev-parse --short=7 HEAD:external/canopy)
          if ! docker manifest inspect "ghcr.io/slaclab/canopy:${CANOPY_TAG}" >/dev/null; then
            echo "::error::ghcr.io/slaclab/canopy:${CANOPY_TAG} not found. Point external/canopy at a slaclab/canopy main commit whose Build Image run published an image (re-run this workflow if that build is still in progress)."
            exit 1
          fi
          echo "CANOPY_TAG=$CANOPY_TAG" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.prod -t $IMAGE_NAME:$IMAGE_TAG . --provenance=false
          docker tag $IMAGE_NAME:$IMAGE_TAG ghcr.io/${OWNER_LC}/$IMAGE_NAME:$IMAGE_TAG
      - name: Push Docker image
        run: docker push ghcr.io/${OWNER_LC}/$IMAGE_NAME:$IMAGE_TAG

      # Argo CD deploys whatever is in git, so commit the new tags to the overlay
      # for the branch that triggered the build (main -> prod, staging ->
      # staging). Pushes made with GITHUB_TOKEN don't trigger new workflow runs.
      # Each sed only touches the newTag line that follows its image's name.
      - name: Update overlay image tags
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            ENVIRONMENT=prod
            BRANCH=main
          else
            ENVIRONMENT=staging
            BRANCH=staging
          fi
          OVERLAY="deploy/kubernetes/overlays/${ENVIRONMENT}/kustomization.yaml"
          set_tag() {
            sed -i -E "\|name: ghcr\.io/slaclab/$1\$|,/newTag:/ s|^([[:space:]]*newTag:).*|\1 \"$2\"|" "$OVERLAY"
            grep -A1 -E "name: ghcr\.io/slaclab/$1\$" "$OVERLAY" | grep -q "newTag: \"$2\""
          }
          set_tag "${IMAGE_NAME}" "${IMAGE_TAG}"
          set_tag canopy "${CANOPY_TAG}"
          git add "$OVERLAY"
          if git diff --cached --quiet; then
            echo "${ENVIRONMENT} overlay already at ${IMAGE_TAG} / canopy ${CANOPY_TAG}"
            exit 0
          fi
          git commit -m "Deploy ${IMAGE_NAME}:${IMAGE_TAG} and canopy:${CANOPY_TAG} to ${ENVIRONMENT}"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
