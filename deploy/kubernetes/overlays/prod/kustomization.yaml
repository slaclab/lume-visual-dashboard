apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# API URLs for this environment; see config.js.
configMapGenerator:
  - name: dashboard-config
    behavior: replace
    files:
      - config.js

labels:
  - pairs:
      environment: prod

# Pin to a specific image tag — do not use "latest" in production.
# The update-image workflow sets newTag to the 7-char commit SHA on each build from main.
images:
  - name: ghcr.io/slaclab/lume-visual-dashboard
    newTag: "39880f9"
