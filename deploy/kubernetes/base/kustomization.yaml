apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lume-visual-dashboard

resources:
  - dashboard.yaml
  - ingress.yaml
  - canopy.yaml
  - canopy-ingress.yaml

configMapGenerator:
  # Runtime settings (API URLs) mounted over the image's config.js. Overlays replace it.
  - name: dashboard-config
    files:
      - config.js

images:
  - name: lume-visual-dashboard-image
    newName: ghcr.io/slaclab/lume-visual-dashboard
    newTag: latest # Overridden per environment in overlays/
  # Published by slaclab/canopy's Build Image workflow for each main commit.
  - name: lume-canopy-image
    newName: ghcr.io/slaclab/canopy
    newTag: latest # Overridden per environment in overlays/
