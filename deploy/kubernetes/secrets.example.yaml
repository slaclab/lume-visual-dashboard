# Template for overlays/<env>/secrets.yaml. Copy it there (that path is gitignored) and fill it in.
#
# Values that must stay out of git, for the lume-canopy and lume-visual-dashboard Deployments.
# The repo is public and Argo CD only syncs what's in git, so these Secrets are applied by hand:
#
#   1. Generate one read token per cluster (no "cnpy_" prefix, which Canopy reserves for
#      database-issued keys):
#        python3 -c "import secrets; print(secrets.token_urlsafe(32))"
#   2. Replace every <...> below. READ_TOKEN appears twice and must match.
#   3. Apply it to this file's cluster only, naming the context explicitly, before pushing the
#      overlay that needs it. The Secret names are the same on every cluster, so applying to the
#      wrong one overwrites that cluster's values:
#        kubectl --context <this cluster's context> apply -f <this file>
#   4. After changing a value later, restart both Deployments; neither picks up a changed Secret:
#        kubectl --context <this cluster's context> -n lume-visual-dashboard rollout restart deployment/lume-canopy deployment/lume-visual-dashboard
apiVersion: v1
kind: Secret
metadata:
  name: lume-canopy-env
  namespace: lume-visual-dashboard
  labels:
    app.kubernetes.io/name: lume-canopy
type: Opaque
stringData:
  # Canopy checks these keys in memory; there is no database. Read-only and limited to Hare,
  # since the same token is sent to every browser by canopy-key.js below.
  CANOPY_API_KEYS: "<READ_TOKEN>:read@hare"
  # EPICS gateways reachable from this cluster, space-separated host[:port].
  EPICS_CA_ADDR_LIST: "<CA gateway addresses>"
  EPICS_PVA_ADDR_LIST: "<PVA gateway addresses>"
---
apiVersion: v1
kind: Secret
metadata:
  name: lume-visual-dashboard-canopy-key
  namespace: lume-visual-dashboard
  labels:
    app.kubernetes.io/name: lume-visual-dashboard
type: Opaque
stringData:
  # Served as /lume-visual-dashboard/canopy-key.js, after config.js. Anyone who can open the
  # dashboard can read this token; the Secret only keeps it out of git.
  canopy-key.js: |
    window.__LUME_DASHBOARD_CONFIG__ = Object.assign(window.__LUME_DASHBOARD_CONFIG__ || {}, {
      canopyApiKey: '<READ_TOKEN>',
    });
